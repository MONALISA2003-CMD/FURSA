name: Apply FURSA Bundle

on:
  push:
    paths:
      - "FURSA_BOOTSTRAP_BUNDLE.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fursa-bundle-apply
  cancel-in-progress: false

jobs:
  apply-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate and apply bundle
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import os
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          archive = root / "FURSA_BOOTSTRAP_BUNDLE.zip"

          if not archive.is_file():
              raise SystemExit(
                  "FURSA_BOOTSTRAP_BUNDLE.zip was not found at the repository root."
              )

          MAX_FILES = 5000
          MAX_TOTAL_BYTES = 100 * 1024 * 1024

          PROTECTED_DELETE = {
              "FURSA_BOOTSTRAP_BUNDLE.zip",
              ".github/workflows/apply-fursa-bundle.yml",
          }

          def clean_rel(raw, *, for_delete=False):
              if not isinstance(raw, str) or not raw.strip():
                  raise ValueError(f"Invalid empty or non-string path: {raw!r}")

              if "\\" in raw or "\x00" in raw:
                  raise ValueError(f"Invalid path syntax: {raw!r}")

              p = PurePosixPath(raw)

              if p.is_absolute() or any(
                  part in ("", ".", "..") for part in p.parts
              ):
                  raise ValueError(f"Unsafe relative path: {raw!r}")

              if ".git" in p.parts:
                  raise ValueError("Bundle may not modify Git internals.")

              normalized = p.as_posix()

              if normalized == "FURSA_BOOTSTRAP_BUNDLE.zip":
                  raise ValueError("Bundle may not replace itself.")

              if normalized == ".github/workflows/apply-fursa-bundle.yml":
                  raise ValueError(
                      "The updater workflow must be managed manually, not from the bundle."
                  )

              if for_delete and normalized in PROTECTED_DELETE:
                  raise ValueError(
                      f"Protected path cannot be deleted: {normalized}"
                  )

              return normalized

          def destination(rel):
              target = root.joinpath(*PurePosixPath(rel).parts)

              # Do not follow symlinked parent directories.
              cursor = root

              for part in PurePosixPath(rel).parts[:-1]:
                  cursor = cursor / part

                  if cursor.is_symlink():
                      raise ValueError(
                          f"Refusing to traverse symlinked parent: {cursor}"
                      )

              if not target.resolve(strict=False).is_relative_to(root):
                  raise ValueError(
                      f"Resolved path escapes repository: {rel}"
                  )

              return target

          with zipfile.ZipFile(archive, "r") as zf:
              infos = zf.infolist()

              if len(infos) > MAX_FILES:
                  raise SystemExit("Bundle contains too many ZIP entries.")

              total_size = sum(i.file_size for i in infos)

              if total_size > MAX_TOTAL_BYTES:
                  raise SystemExit(
                      "Bundle uncompressed size exceeds 100 MB."
                  )

              if "manifest.json" not in zf.namelist():
                  raise SystemExit("Bundle is missing manifest.json.")

              try:
                  manifest = json.loads(
                      zf.read("manifest.json").decode("utf-8")
                  )
              except Exception as exc:
                  raise SystemExit(f"Cannot read manifest.json: {exc}")

              replacements = manifest.get("replace", [])
              deletions = manifest.get("delete", [])

              if not isinstance(replacements, list) or not isinstance(deletions, list):
                  raise SystemExit(
                      "manifest.json must contain 'replace' and 'delete' arrays."
                  )

              replacements = [clean_rel(p) for p in replacements]
              deletions = [
                  clean_rel(p, for_delete=True) for p in deletions
              ]

              if len(set(replacements)) != len(replacements):
                  raise SystemExit("Manifest contains duplicate replacement paths.")

              if len(set(deletions)) != len(deletions):
                  raise SystemExit("Manifest contains duplicate deletion paths.")

              overlap = set(replacements) & set(deletions)

              if overlap:
                  raise SystemExit(
                      f"A path cannot be both replaced and deleted: {sorted(overlap)}"
                  )

              payload_entries = {}

              for info in infos:
                  name = info.filename

                  if info.is_dir() or name == "manifest.json":
                      continue

                  mode = (info.external_attr >> 16) & 0o170000

                  if mode == stat.S_IFLNK:
                      raise SystemExit(
                          f"Symlinks are not allowed in the bundle: {name}"
                      )

                  if name.startswith("payload/"):
                      rel = clean_rel(name[len("payload/"):])

                      if rel in payload_entries:
                          raise SystemExit(
                              f"Duplicate file in payload: {rel}"
                          )

                      payload_entries[rel] = zf.read(info)

                  else:
                      raise SystemExit(
                          "Unexpected ZIP entry; expected manifest.json "
                          f"or payload/...: {name}"
                      )

              if set(payload_entries) != set(replacements):
                  missing = sorted(set(replacements) - set(payload_entries))
                  extra = sorted(set(payload_entries) - set(replacements))

                  raise SystemExit(
                      f"Manifest/payload mismatch. Missing: {missing}; extra: {extra}"
                  )

              deleted = []

              # Delete only files explicitly listed in manifest.json.
              for rel in deletions:
                  target = destination(rel)

                  if target.is_symlink() or target.is_file():
                      target.unlink()
                      deleted.append(rel)

                  elif target.exists():
                      raise SystemExit(
                          f"Delete entries must name files, not directories: {rel}"
                      )

              written = []

              # Create new files and replace existing files.
              for rel, content in payload_entries.items():
                  target = destination(rel)

                  if target.is_symlink():
                      target.unlink()

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
                  written.append(rel)

          print(
              f"Applied bundle version {manifest.get('version', 'unspecified')}: "
              f"{len(written)} file(s) written/replaced; "
              f"{len(deleted)} file(s) deleted."
          )

          print("Files not listed in manifest.delete were preserved.")
          PYTHON

      - name: Commit applied files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Bundle produced no repository changes."
            exit 0
          fi

          git commit -m "Apply FURSA engineering bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
