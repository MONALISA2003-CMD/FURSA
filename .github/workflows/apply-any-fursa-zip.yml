name: Apply Any FURSA ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file in repository root (required if multiple ZIPs exist)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fursa-bundle-apply
  cancel-in-progress: false

jobs:
  apply-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select ZIP
        id: pick
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.zip_file }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          candidate=""

          if [[ -n "$REQUESTED_ZIP" ]]; then
            candidate="$REQUESTED_ZIP"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t candidates < <(
              git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r HEAD \
                | grep -E '^[^/]+\.zip$' \
                | sort -u || true
            )
            if (( ${#candidates[@]} == 0 )); then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No added or modified root ZIP was found (likely a ZIP-deletion-only commit). Nothing to do."
              exit 0
            fi
            if (( ${#candidates[@]} > 1 )); then
              printf 'Multiple ZIPs changed. Run this workflow manually and set zip_file to one of:\n%s\n' "${candidates[*]}" >&2
              exit 1
            fi
            candidate="${candidates[0]}"
          else
            mapfile -t candidates < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
            if (( ${#candidates[@]} == 0 )); then
              echo "No ZIP found in the repository root." >&2
              exit 1
            fi
            if (( ${#candidates[@]} > 1 )); then
              printf 'Multiple ZIPs are available. Set zip_file to one of:\n%s\n' "${candidates[*]}" >&2
              exit 1
            fi
            candidate="${candidates[0]}"
          fi

          if [[ -z "$candidate" || "$candidate" == */* || "$candidate" != *.zip || ! -f "$candidate" ]]; then
            echo "ZIP must be an existing file in the repository root." >&2
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "file=$candidate" >> "$GITHUB_OUTPUT"
          echo "Selected $candidate"

      - name: Validate, extract, and remove ZIP from runner
        id: extract
        if: steps.pick.outputs.skip != 'true'
        env:
          ZIP_FILE: ${{ steps.pick.outputs.file }}
        run: |
          python - <<'PY'
          import json, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          archive_name = os.environ["ZIP_FILE"]
          archive = root / archive_name
          max_files, max_bytes = 5000, 100 * 1024 * 1024
          files = {}
          delete = []

          def clean(raw):
              if not isinstance(raw, str) or not raw.strip() or "\\" in raw or "\x00" in raw:
                  raise ValueError(f"Invalid path: {raw!r}")
              if any(ord(ch) < 32 for ch in raw):
                  raise ValueError(f"Control character in path: {raw!r}")
              p = PurePosixPath(raw)
              if p.is_absolute() or any(x in ("", ".", "..") for x in p.parts) or ".git" in p.parts:
                  raise ValueError(f"Unsafe path: {raw!r}")
              rel = p.as_posix()
              if rel == ".github/workflows" or rel.startswith(".github/workflows/"):
                  raise ValueError(f"Workflow files must be managed manually: {rel}")
              return rel

          def target_for(rel):
              target = root.joinpath(*PurePosixPath(rel).parts)
              cursor = root
              for part in PurePosixPath(rel).parts[:-1]:
                  cursor = cursor / part
                  if cursor.is_symlink():
                      raise ValueError(f"Symlinked parent forbidden: {cursor}")
              if not target.resolve(strict=False).is_relative_to(root):
                  raise ValueError(f"Path escapes repository: {rel}")
              return target

          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if len(infos) > max_files or sum(i.file_size for i in infos) > max_bytes:
                  raise SystemExit("ZIP exceeds safety limits.")
              if z.testzip() is not None:
                  raise SystemExit("ZIP contains a corrupt member or CRC mismatch.")
              names = [i.filename for i in infos]
              manifest = {"version": "plain-zip", "replace": [], "delete": []}

              if "manifest.json" in names:
                  try:
                      manifest = json.loads(z.read("manifest.json").decode("utf-8"))
                  except Exception as e:
                      raise SystemExit(f"Invalid manifest.json: {e}")
                  if not isinstance(manifest, dict):
                      raise SystemExit("manifest.json must contain a JSON object.")
                  replace = manifest.get("replace", [])
                  delete = manifest.get("delete", [])
                  if not isinstance(replace, list) or not isinstance(delete, list):
                      raise SystemExit("Manifest replace/delete must be arrays.")
                  replace = [clean(p) for p in replace]
                  delete = [clean(p) for p in delete]
                  if len(set(replace)) != len(replace) or len(set(delete)) != len(delete):
                      raise SystemExit("Duplicate manifest path.")
                  if set(replace) & set(delete):
                      raise SystemExit("A path cannot be both replaced and deleted.")
                  for info in infos:
                      if info.is_dir() or info.filename == "manifest.json":
                          continue
                      if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                          raise SystemExit(f"Symlink forbidden: {info.filename}")
                      if not info.filename.startswith("payload/"):
                          raise SystemExit(f"Expected payload/ entry: {info.filename}")
                      rel = clean(info.filename[len("payload/"):])
                      if rel in files:
                          raise SystemExit(f"Duplicate payload: {rel}")
                      files[rel] = z.read(info)
                  if set(files) != set(replace):
                      raise SystemExit("Manifest and payload file list do not match.")
                  changed_paths = replace + delete
              else:
                  for info in infos:
                      if info.is_dir():
                          continue
                      if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                          raise SystemExit(f"Symlink forbidden: {info.filename}")
                      rel = clean(info.filename)
                      if rel in files:
                          raise SystemExit(f"Duplicate ZIP path: {rel}")
                      files[rel] = z.read(info)
                  changed_paths = list(files)

          # Validate destinations before changing files.
          for rel in changed_paths:
              target_for(rel)
          for rel in files:
              target_for(rel)

          for rel in delete:
              path = target_for(rel)
              if path.is_symlink() or path.is_file():
                  path.unlink()
              elif path.exists():
                  raise SystemExit(f"Delete path is not a file: {rel}")

          for rel, content in files.items():
              path = target_for(rel)
              if path.is_symlink():
                  path.unlink()
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)

          # Remove the uploaded archive from the runner immediately.
          # The following commit/cleanup steps remove it from GitHub as well.
          archive.unlink(missing_ok=True)
          print(f"Applied {archive_name}: {len(files)} files written/replaced; {len(delete)} deleted.")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write("bundle_paths<<FURSA_BUNDLE_PATHS_EOF\n")
                  output.write("\n".join(changed_paths))
                  output.write("\nFURSA_BUNDLE_PATHS_EOF\n")
          PY

      - name: Set up Python for validation
        if: steps.pick.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Run API checks against extracted files
        if: steps.pick.outputs.skip != 'true'
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Set up Node for validation
        if: steps.pick.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frontend checks against extracted files
        if: steps.pick.outputs.skip != 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit validated application files and remove uploaded ZIP
        if: steps.pick.outputs.skip != 'true'
        env:
          ZIP_FILE: ${{ steps.pick.outputs.file }}
          BUNDLE_PATHS: ${{ steps.extract.outputs.bundle_paths }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only paths declared in the bundle, not generated build output.
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            git add -A -- "$path"
          done <<< "$BUNDLE_PATHS"

          # The uploaded ZIP was removed during extraction.
          git add -A -- "$ZIP_FILE"

          # Stop tracking build metadata accidentally committed by the older workflow.
          # The corrected .gitignore excludes future generated TypeScript build information.
          if git ls-files --error-unmatch apps/web/tsconfig.tsbuildinfo >/dev/null 2>&1; then
            git rm --cached --force -- apps/web/tsconfig.tsbuildinfo
          fi

          if git diff --cached --quiet; then
            echo "Bundle made no tracked changes."
            exit 0
          fi

          git commit -m "Apply validated FURSA ZIP bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove uploaded ZIP if bundle application fails
        if: failure() && steps.pick.outputs.skip != 'true' && steps.pick.outputs.file != ''
        env:
          ZIP_FILE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the ZIP deletion. Never commit partially extracted app code.
          git rm -f --ignore-unmatch -- "$ZIP_FILE"

          if git diff --cached --quiet; then
            echo "No uploaded ZIP deletion to commit."
            exit 0
          fi

          git commit -m "Remove failed FURSA ZIP upload"
          git push origin "HEAD:${GITHUB_REF_NAME}"
